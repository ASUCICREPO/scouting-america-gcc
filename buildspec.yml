version: 0.2

# CodeBuild spec for the Scouting America GCC Chatbot backend.
# Builds + tests the CDK app, then deploys the ScoutingAmericaChatbot stack.
# Lambda handlers are Python 3.13 (boto3 in the runtime — no build step needed);
# the CDK app itself is TypeScript and runs on Node.

env:
  variables:
    STACK_NAME: "ScoutingAmericaChatbot"
    AWS_REGION: "us-east-1"

phases:
  install:
    runtime-versions:
      nodejs: 20
      python: 3.13
    commands:
      - echo "Installing backend dependencies"
      - cd backend
      - npm ci

  pre_build:
    commands:
      - echo "Running unit tests"
      - npx jest --ci
      - echo "Synthesizing CloudFormation template (cdk-nag runs here)"
      - npx cdk synth

  build:
    commands:
      - echo "Deploying $STACK_NAME to $AWS_REGION"
      - npx cdk deploy --require-approval never

  post_build:
    commands:
      - echo "Capturing stack outputs"
      - |
        aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" --region "$AWS_REGION" \
          --query "Stacks[0].Outputs" --output table

artifacts:
  base-directory: backend
  files:
    - cdk.out/**/*
