version: 0.2

# Unified CodeBuild deployment for the Scouting America GCC chatbot.
# deploy.sh uploads the reviewed Git commit as an S3 source archive, creates or
# updates the CodeBuild project, and supplies the environment variables below.

phases:
  install:
    runtime-versions:
      nodejs: 20
      python: 3.13
    commands:
      - echo "Installing backend dependencies"
      - cd "$CODEBUILD_SRC_DIR/backend"
      - npm ci

  pre_build:
    commands:
      - echo "Running backend unit tests"
      # Unit assertions target the canonical unprefixed template. The actual
      # deployment keeps the project-supplied RESOURCE_PREFIX below.
      - RESOURCE_PREFIX='' CDK_TEST_SKIP_PYTHON_BUNDLING=true npm test -- --runInBand
      - echo "Bootstrapping the target account and Region"
      - >-
        npx cdk bootstrap
        "aws://${CDK_DEFAULT_ACCOUNT}/${AWS_REGION}"
        --bootstrap-kms-key-id AWS_MANAGED_KEY

  build:
    commands:
      - echo "Deploying the $STACK_NAME CDK stack"
      - cd "$CODEBUILD_SRC_DIR/backend"
      - npx cdk deploy "$STACK_NAME" --require-approval never
      - |
        set -euo pipefail

        stack_output() {
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
            --output text
        }

        CHAT_API_URL="$(stack_output ChatApiUrl)"
        DASHBOARD_API_URL="$(stack_output DashboardApiUrl)"
        USER_POOL_ID="$(stack_output UserPoolId)"
        CLIENT_ID="$(stack_output UserPoolClientId)"
        PUBLIC_FRONTEND_BUCKET="$(stack_output PublicFrontendBucket)"
        PUBLIC_FRONTEND_DIST_ID="$(stack_output PublicFrontendDistributionId)"
        PUBLIC_FRONTEND_URL="$(stack_output PublicFrontendUrl)"
        ADMIN_FRONTEND_BUCKET="$(stack_output AdminFrontendBucket)"
        ADMIN_FRONTEND_DIST_ID="$(stack_output AdminFrontendDistributionId)"
        ADMIN_FRONTEND_URL="$(stack_output AdminFrontendUrl)"

        test -n "$CHAT_API_URL"
        test "$CHAT_API_URL" != "None"
        test -n "$PUBLIC_FRONTEND_BUCKET"
        test "$PUBLIC_FRONTEND_BUCKET" != "None"
        test -n "$ADMIN_FRONTEND_BUCKET"
        test "$ADMIN_FRONTEND_BUCKET" != "None"

        CHAT_API_URL="${CHAT_API_URL%/}"
        DASHBOARD_API_URL="${DASHBOARD_API_URL%/}"

        echo "Building the Next.js static export"
        cd "$CODEBUILD_SRC_DIR/frontend"
        npm ci
        cat > .env.local <<EOF
        NEXT_PUBLIC_API_URL=$CHAT_API_URL
        NEXT_PUBLIC_DASHBOARD_API_URL=$DASHBOARD_API_URL
        NEXT_PUBLIC_USER_POOL_ID=$USER_POOL_ID
        NEXT_PUBLIC_CLIENT_ID=$CLIENT_ID
        NEXT_PUBLIC_AWS_REGION=$AWS_REGION
        EOF
        npm run build
        test -d out

        echo "Publishing the public chat to its private S3 origin"
        aws s3 sync out "s3://$PUBLIC_FRONTEND_BUCKET" \
          --delete \
          --exclude "dashboard/*" \
          --exclude "login/*" \
          --region "$AWS_REGION"
        aws s3 rm "s3://$PUBLIC_FRONTEND_BUCKET/dashboard/" \
          --recursive \
          --region "$AWS_REGION"
        aws s3 rm "s3://$PUBLIC_FRONTEND_BUCKET/login/" \
          --recursive \
          --region "$AWS_REGION"

        echo "Publishing the admin application to its private S3 origin"
        aws s3 sync out "s3://$ADMIN_FRONTEND_BUCKET" \
          --delete \
          --region "$AWS_REGION"

        aws cloudfront create-invalidation \
          --distribution-id "$PUBLIC_FRONTEND_DIST_ID" \
          --paths "/*" \
          --region "$AWS_REGION" >/dev/null
        aws cloudfront create-invalidation \
          --distribution-id "$ADMIN_FRONTEND_DIST_ID" \
          --paths "/*" \
          --region "$AWS_REGION" >/dev/null

        echo "GCC deployment complete"
        echo "Public chat: $PUBLIC_FRONTEND_URL"
        echo "Admin dashboard: $ADMIN_FRONTEND_URL"

  post_build:
    commands:
      - echo "CodeBuild deployment finished with status $CODEBUILD_BUILD_SUCCEEDING"

artifacts:
  files:
    - backend/cdk.out/**/*
